<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pseudo-AI 챗봇</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="chat-shell">
      <header>
        <p class="eyebrow">SQLITE + FASTAPI</p>
        <h1>Pseudo-AI 챗봇</h1>
        <p id="connection-status" class="status">서버 연결을 확인하는 중...</p>
      </header>
      <section id="messages" class="messages" aria-live="polite">
        <article class="message bot"><strong>챗봇</strong><p>안녕하세요! 궁금한 것을 물어보세요.</p></article>
      </section>
      <form id="chat-form" class="composer">
        <label class="sr-only" for="question">메시지</label>
        <input id="question" name="question" autocomplete="off" placeholder="메시지를 입력하세요" required>
        <button type="submit">전송</button>
      </form>
    </main>
    <script src="app.js"></script>
  </body>
</html>
